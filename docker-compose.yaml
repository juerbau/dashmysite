services:
  postgres:
    image: postgres:16
    container_name: pulse-postgres

    env_file:
      - ./docker/postgres/postgres.env

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - pulse_postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pulse_postgres_data: